    values:
      - Edamam
  - name: ApiSurface
    values:
      - Recipe Search
      - Nutrition Analysis
      - Food Database
      - Meal Planner
      - Shopping List
  - name: Authentication
    values:
      - app_id + app_key (query)
      - HTTP Basic (app_id:app_key)
