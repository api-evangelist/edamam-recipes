openapi: 3.0.3
info:
  version: '2.0'
  title: Food Database Food Nutrition Request - AI Vision (Beta) Food Nutrition Request - AI Vision (Beta) Food Request Step 1 - Parser API
  description: ''
servers:
- url: https://api.edamam.com
tags:
- name: Food Request Step 1 - Parser
paths:
  /api/food-database/v2/parser:
    get:
      tags:
      - Food Request Step 1 - Parser
      summary: Food Search
      description: "The parser access point handles text search for foods as well as filters for the foods like presence specific\nnutrient content or exclusion of allergens.\n\n  - Search for a phrase or keyword using NLP to get food entities from it\n  - Get basic nutrition facts and ingredients for each food\n  - Search for food by given nutrient quantity for 28 nutrients\n  - Search for foods within a given brand\n  - With the build in food-logging context it allows for requests which do not contain quantity and suggest\n       expected quantities for them.\n\n**Access Point:** <https://api.edamam.com/api/food-database/v2/parser>"
      parameters:
      - name: app_id
        in: query
        x-data-threescale-name: app_ids
        description: The application ID, obtained from the account dashboard, <https://developer.edamam.com/admin/applications>.
        required: true
        schema:
          type: string
      - name: app_key
        in: query
        x-data-threescale-name: app_keys
        description: The application key, obtained from the account dashboard, <https://developer.edamam.com/admin/applications>.
        required: true
        schema:
          type: string
      - name: Edamam-Account-User
        description: ID of the account user. Should be used *only* if the account is configured for active user tracking.
        in: header
        schema:
          type: string
      - name: ingr
        in: query
        description: 'A keyword search parameter to be found in the food name. **REQUIRED** if `upc` **and** `brand` are not

          specified. **NOT REQUIRED** if `brand` is specified. **DO NOT POPULATE** if `upc` is specified.'
        schema:
          type: string
      - name: brand
        in: query
        description: 'A keyword search parameter to be found in the food''s brand. **REQUIRED** if `ingr` **and** `upc` are not

          specified. **NOT REQUIRED** if `ingr` is specified. **DO NOT POPULATE** if `upc` is specified.'
        schema:
          type: string
      - name: upc
        in: query
        description: 'Valid UPC, EAN, or PLU code. **REQUIRED** if neither `ingr` **nor** `brand` are specified.

          **DO NOT POPULATE** otherwise.'
        schema:
          type: string
      - name: nutrition-type
        in: query
        description: Select between cooking and food logging processor.
        schema:
          type: string
          default: cooking
          enum:
          - cooking
          - logging
      - name: health
        in: query
        description: Health label
        style: form
        explode: true
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - alcohol-free
            - celery-free
            - crustacean-free
            - dairy-free
            - egg-free
            - fish-free
            - fodmap-free
            - gluten-free
            - immuno-supportive
            - keto-friendly
            - kidney-friendly
            - kosher
            - low-fat-abs
            - low-potassium
            - low-sugar
            - lupine-free
            - mustard-free
            - no-oil-added
            - paleo
            - peanut-free
            - pescatarian
            - pork-free
            - red-meat-free
            - sesame-free
            - shellfish-free
            - soy-free
            - sugar-conscious
            - tree-nut-free
            - vegan
            - vegetarian
            - wheat-free
      - name: calories
        in: query
        description: 'The format is calories=RANGE where RANGE is replaced by the value in kcal. RANGE is in one of MIN+, MIN-MAX

          or MAX, where MIN and MAX are non-negative integer numbers. The + symbol needs to be properly encoded.

          Examples: “calories=100-300” will return all recipes with which have between 100 and 300 kcal per serving.'
        schema:
          type: string
      - name: category
        in: query
        description: Categories
        style: form
        explode: true
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - generic-foods
            - generic-meals
            - packaged-foods
            - fast-foods
      - name: nutrients[CA]
        in: query
        description: 'Calcium, Ca. Unit: mg. Input the range which is one of MIN+, MIN-MAX or MAX, where MIN and MAX are

          non-negative floating point numbers.


          For example: nutrients[CA]=50+ means minimum 50mg calcium, where ‘50+’ has to be properly encoded as ‘50%2B’

          nutrients[FAT]=30 means maximum 30g fat and nutrients[FE]=5-10 means iron between 5mg and 10mg inclusive.'
        schema:
          type: string
          pattern: (?:[+-]?\d+(?:\.\d*)?)|(?:(?:[+-]?\d+(?:\.\d*)?)-(?:[+-]?\d+(?:\.\d*)?))|(?:(?:[+-]?\d+(?:\.\d*)?)[+-])
      - name: nutrients[CHOCDF]
        in: query
        description: 'Carbohydrate, by difference. Unit: g. Input the range which is one of MIN+, MIN-MAX or MAX, where MIN and

          MAX are non-negative floating point numbers.


          See calcium for an example for how to fill in the range.'
        schema:
          type: string
          pattern: (?:[+-]?\d+(?:\.\d*)?)|(?:(?:[+-]?\d+(?:\.\d*)?)-(?:[+-]?\d+(?:\.\d*)?))|(?:(?:[+-]?\d+(?:\.\d*)?)[+-])
      - name: nutrients[CHOCDF.net]
        in: query
        description: 'Carbohydrates (net). Unit: g. Input the range which is one of MIN+, MIN-MAX or MAX, where MIN and MAX are

          non-negative floating point numbers.


          See calcium for an example for how to fill in the range.'
        schema:
          type: string
          pattern: (?:[+-]?\d+(?:\.\d*)?)|(?:(?:[+-]?\d+(?:\.\d*)?)-(?:[+-]?\d+(?:\.\d*)?))|(?:(?:[+-]?\d+(?:\.\d*)?)[+-])
      - name: nutrients[CHOLE]
