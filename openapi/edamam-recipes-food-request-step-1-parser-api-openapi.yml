components:
  schemas:
    WeightedMeasure:
      type: object
      properties:
        qualifiers:
          type: array
          items:
            $ref: '#/components/schemas/Term'
        weight:
          type: number
    Errors:
      type: array
      items:
        $ref: '#/components/schemas/Error'
    ParseResponse:
      type: object
      properties:
        text:
          type: string
        count:
          type: integer
        parsed:
          type: array
          items:
            $ref: '#/components/schemas/Parsed'
        hints:
          type: array
          items:
            $ref: '#/components/schemas/Hint'
        _links:
          $ref: '#/components/schemas/HATEOAS'
    Food:
      type: object
      properties:
        foodId:
          type: string
        uri:
          type: string
        label:
          type: string
        knownAs:
          type: string
        nutrients:
          type: object
          additionalProperties:
            type: number
        brand:
          type: string
        category:
          type: string
        categoryLabel:
          type: string
        foodContentsLabel:
          type: string
        image:
          type: string
        servingSizes:
          type: array
          items:
            $ref: '#/components/schemas/Quantity'
        servingsPerContainer:
          type: number
    Error:
      properties:
        errorCode:
          type: string
        message:
          type: string
        params:
          type: array
          items:
            type: string
    Hint:
      type: object
      properties:
        pluCode:
          $ref: '#/components/schemas/PLUCode'
        food:
          $ref: '#/components/schemas/Food'
        measures:
          type: array
          items:
            $ref: '#/components/schemas/Measure'
    Quantity:
      type: object
      properties:
        uri:
          type: string
        label:
          type: string
        quantity:
          type: number
    HATEOAS:
      type: object
      properties:
        next:
          $ref: '#/components/schemas/Link'
    PLUCode:
      type: object
      properties:
        code:
          type: string
        category:
          type: string
        commodity:
          type: string
        variety:
          type: string
        isRetailerAssigned:
          type: boolean
    Parsed:
      type: object
      properties:
        food:
          $ref: '#/components/schemas/Food'
        quantity:
          type: number
        measure:
          $ref: '#/components/schemas/Measure'
    Measure:
      type: object
      properties:
        uri:
          type: string
        label:
          type: string
        weight:
          type: number
        qualified:
          type: array
          items:
