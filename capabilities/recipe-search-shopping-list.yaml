naftiko: "1.0.0-alpha2"

info:
  label: "Edamam Recipe Search — Shopping List"
  description: >-
    Recipe Search — Shopping List. 1 operation. Lead operation: Create Shopping List From Total Meal Quantities.
    Self-contained Naftiko capability covering one Edamam business surface.
  tags:
    - Edamam
    - Recipe Search
    - Shopping List
  created: "2026-05-30"
  modified: "2026-05-30"

binds:
  - namespace: env
    keys:
      EDAMAM_RECIPE_APP_ID: EDAMAM_RECIPE_APP_ID
      EDAMAM_RECIPE_APP_KEY: EDAMAM_RECIPE_APP_KEY

capability:

  consumes:
    - type: http
      namespace: "recipe-search-shopping-list"
      baseUri: "https://api.edamam.com"
      description: "Edamam Recipe Search — Shopping List aggregation surface."
      authentication:
        type: basic
        username: "{{env.EDAMAM_RECIPE_APP_ID}}"
        password: "{{env.EDAMAM_RECIPE_APP_KEY}}"
      resources:
        - name: "shopping-list"
          path: "/api/meal-planner/v1/shopping-list"
          operations:
            - name: "createShoppingList"
              method: POST
              description: "Create a shopping list aggregating ingredients across one or more recipes."
              inputParameters:
                - name: beta
                  in: query
                  type: boolean
                  required: false
                - name: body
                  in: body
                  type: object
                  required: true
                  description: "Recipe preparation plan: entries[] with quantity, measure, item URIs."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      namespace: "recipe-search-shopping-list-rest"
      port: 8080
      description: "REST adapter for Edamam Shopping List."
      resources:
        - path: "/v1/shopping-lists"
          name: "shopping-lists"
          description: "REST surface for creating shopping lists."
          operations:
            - method: POST
              name: "createShoppingList"
              description: "Create a shopping list from recipe preparation plan."
              call: "recipe-search-shopping-list.createShoppingList"
              with:
                beta: "rest.beta"
                body: "rest.body"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      namespace: "recipe-search-shopping-list-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for Edamam Shopping List."
      tools:
        - name: "create-shopping-list"
          description: "Create a shopping list from recipe preparation plan."
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "recipe-search-shopping-list.createShoppingList"
          with:
            beta: "tools.beta"
            body: "tools.body"
          outputParameters:
            - type: object
              mapping: "$."
