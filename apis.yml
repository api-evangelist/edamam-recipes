- aid: edamam-recipes:edamam-recipes-shopping-list-api
  name: Edamam Shopping List API
  description: >-
    The *Shopping List API* provides aggregation of shopping item quantities over one or more ingredient
    lists, and

    optional referral to external shopping services.


    A `shopping-list` call may be issued on a recipe preparation plan, e.g. for recipes assigned to a
    meal plan's

    slots, to obtain total shopping quantities for the products involved.  Each item in the plan may be
    scaled

    individually for the shopping list by indicating the planned consumption as a number of servings;
    in the absence

    of such indication, consumption (and therefore preparation) of the complete output of the recipe will
    be assumed.

    Both recipes and directly consumable foodstuffs are supported as items in the plan.
